name: Snapshot FPL data

on:
  schedule:
    # Every Tuesday at 06:00 UTC — after weekend fixtures and bonus points finalize.
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run snapshot

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Snapshot FPL data ($(date -u +%Y-%m-%d))"
          git push
